name: Sync and Patch Shadowrocket Rules

# 每天 07:30 北京时间跑一次 (上游每天 23:00 UTC = 07:00 北京时间构建,
# 这里用 23:30 UTC = 07:30 北京时间, 保证拉到的是最新版)
# 也可以在 Actions 页面点 Run workflow 手动跑一次
"on":
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (release branch)
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Download latest upstream
        run: |
          curl -L -o sr_top500_whitelist_ad.conf https://johnshall.github.io/Shadowrocket-ADBlock-Rules-Forever/sr_top500_whitelist_ad.conf
          ls -lh sr_top500_whitelist_ad.conf
          head -n 5 sr_top500_whitelist_ad.conf

      - name: Apply domestic DIRECT patch
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          python3 - << 'PY'
          import os, re
          path = "sr_top500_whitelist_ad.conf"
          owner = os.environ.get("OWNER", "YOUR_GITHUB_USERNAME")
          fork_url = f"https://{owner}.github.io/Shadowrocket-ADBlock-Rules-Forever/sr_top500_whitelist_ad.conf"

          domains = [
              "weixin.qq.com", "wechat.com", "wx.qq.com",
              "alipay.com", "alipay.cn", "alipayobjects.com", "aliyuncs.com", "alicdn.com",
              "douyin.com", "bytedance.com", "bytecdn.cn",
              "meituan.com", "meituan.net", "dianping.com",
              "pinduoduo.com", "yangkeduo.com",
              "jd.com", "jdcloud.com",
              "zhihu.com", "xiaohongshu.com", "xhs.cn",
              "amap.com", "autonavi.com",
              "tmall.com", "ctrip.com", "tencent.com", "kuaishou.com",
              "xiaomi.com", "mi.com",
          ]

          with open(path, encoding="utf-8", errors="ignore") as f:
              text = f.read()

          # 1. 先去掉旧补丁, 避免重复打 (幂等)
          if "# --- 艾伦补丁" in text:
              start = text.find("# --- 艾伦补丁")
              # 找到补丁后第一个 DOMAIN-SUFFIX,cn, 行, 从那里重新接上
              m = re.search(r"DOMAIN-SUFFIX,cn,", text[start:], re.IGNORECASE)
              assert m, "找到旧补丁但找不到 DOMAIN-SUFFIX,cn, 行"
              text = text[:start] + text[start + m.start():]

          # 2. update-url 改成自己的 fork 地址, 不要指回上游
          #    删掉旧的 update-url 行, 再在 [General] 里补一条
          lines = [l for l in text.splitlines() if not l.strip().startswith("update-url")]
          text = "\n".join(lines) + "\n"
          # 插到 dns-server 那行后面, 没有 dns-server 就插到 [General] 后面
          new_url_line = f"update-url = {fork_url}"
          if "dns-server" in text:
              # 在第一次出现 dns-server 的那行后面插入
              _lines = text.splitlines()
              for i, l in enumerate(_lines):
                  if l.strip().startswith("dns-server"):
                      _lines.insert(i + 1, new_url_line)
                      break
              text = "\n".join(_lines) + "\n"
          else:
              text = text.replace("[General]", "[General]\n" + new_url_line, 1)

          # 3. 在 DOMAIN-SUFFIX,cn,DIRECT 前插入 29 条 DIRECT
          m = re.search(r"DOMAIN-SUFFIX,cn,", text, re.IGNORECASE)
          assert m, "上游格式变了, 没找到 DOMAIN-SUFFIX,cn, 行, 请检查"
          patch = "# --- 艾伦补丁：国内 App 显式直连，放在 FINAL 之前、REJECT 之后 ---\n"
          patch += "# 原因：原配置只有 GEOIP,CN 和 .cn 直连，大量国内 App 用 .com 域名、且可能用海外 CDN IP，只靠 GEOIP 会漏走代理。下面这些域名强制 DIRECT。\n"
          for d in domains:
              patch += f"DOMAIN-SUFFIX,{d},DIRECT\n"
          text = text[:m.start()] + patch + text[m.start():]

          # 4. 校验
          assert "GEOIP,CN,DIRECT" in text, "缺少 GEOIP,CN,DIRECT"
          assert "FINAL,PROXY" in text, "缺少 FINAL,PROXY"
          assert fork_url in text, "update-url 没写成 fork 地址"
          assert text.count("DOMAIN-SUFFIX,weixin.qq.com,DIRECT") == 1

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          print(f"patched OK: {len(text.splitlines())} lines, {len(domains)} domestic DIRECT rules, update-url={fork_url}")
          PY

      - name: Commit and push if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add sr_top500_whitelist_ad.conf
          git diff --cached --quiet && echo "no change, nothing to commit" || (git commit -m "Sync upstream + patch domestic DIRECT [skip ci]" && git push)
